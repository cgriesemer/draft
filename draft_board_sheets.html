<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10U Softball Draft Board</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Barlow:wght@400;500&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* --- STYLES UNCHANGED FROM YOUR ORIGINAL --- */
:root {
  --bg:#0d1117; --surface:#161b22; --surface2:#1c2333; --border:#30363d;
  --gold:#f0a500; --gold-dim:#a87300; --green:#3fb950;
  --red:#f85149; --red-bg:#1a0a0a; --red-border:#5a1a1a;
  --text:#e6edf3; --text-muted:#7d8590; --text-dim:#484f58;
  --mono:'Share Tech Mono',monospace; --head:'Barlow Condensed',sans-serif; --body:'Barlow',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--body);min-height:100vh;padding-bottom:60px;}

header{background:var(--surface);border-bottom:2px solid var(--gold);padding:18px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 4px 24px rgba(0,0,0,.6);}
.header-left{display:flex;align-items:baseline;gap:14px;}
h1{font-family:var(--head);font-size:28px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--gold);line-height:1;}
.subtitle{font-family:var(--head);font-size:14px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);}
.header-right{display:flex;align-items:center;gap:24px;}
.header-stats{display:flex;gap:24px;align-items:center;}
.stat-chip{font-family:var(--mono);font-size:12px;color:var(--text-muted);display:flex;flex-direction:column;align-items:center;gap:2px;}
.stat-chip span{font-size:20px;font-weight:700;font-family:var(--head);color:var(--text);}
.stat-chip.taken span{color:var(--red);}

.sync-status{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;color:var(--text-dim);letter-spacing:.05em;}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--text-dim);flex-shrink:0;transition:background .3s;}
.sync-dot.synced{background:var(--green);}
.sync-dot.syncing{background:var(--gold);animation:pulse .8s infinite;}
.sync-dot.error{background:var(--red);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

.reload-btn{background:none;border:1px solid var(--border);color:var(--text-muted);font-family:var(--head);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:5px 12px;border-radius:4px;cursor:pointer;transition:all .15s;}
.reload-btn:hover{border-color:var(--gold-dim);color:var(--gold);}

.controls{padding:14px 28px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.controls-label{font-family:var(--head);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-right:4px;}
.sort-btn{background:var(--surface);border:1px solid var(--border);color:var(--text-muted);font-family:var(--head);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:7px 16px;border-radius:4px;cursor:pointer;transition:all .15s;}
.sort-btn:hover{border-color:var(--gold-dim);color:var(--text);}
.sort-btn.active{background:var(--gold);border-color:var(--gold);color:#000;}
.divider{width:1px;height:24px;background:var(--border);margin:0 4px;}
.search-wrap{margin-left:auto;position:relative;}
.search-wrap input{background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:var(--body);font-size:13px;padding:7px 12px 7px 32px;border-radius:4px;width:200px;outline:none;}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-dim);font-size:13px;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;padding:20px 28px;}

.empty-state,.error-state{text-align:center;padding:60px;color:var(--text-dim);font-family:var(--head);font-size:18px;letter-spacing:.1em;text-transform:uppercase;}

.loading-overlay{position:fixed;inset:0;background:rgba(13,17,23,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:16px;font-family:var(--head);font-size:16px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);}
.loading-overlay.hidden{display:none;}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>

<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <span id="loadingMsg">Loading from Google Sheets…</span>
</div>

<header>
  <div class="header-left">
    <h1>⚾ Draft Board</h1>
    <span class="subtitle">Spring '26 Minors — 10U</span>
  </div>
  <div class="header-right">
    <div class="sync-status">
      <div class="sync-dot" id="syncDot"></div>
      <span id="syncLabel">Connecting…</span>
    </div>
    <button class="reload-btn" onclick="reloadAll()">↻ Refresh</button>
    <div class="header-stats">
      <div class="stat-chip"><span id="stat-total">—</span>Total</div>
      <div class="stat-chip"><span id="stat-available">—</span>Available</div>
      <div class="stat-chip taken"><span id="stat-taken">—</span>Taken</div>
    </div>
  </div>
</header>

<div class="controls">
  <span class="controls-label">Sort</span>
  <button class="sort-btn active" onclick="setSort('score-desc',event)">Score ↓</button>
  <button class="sort-btn" onclick="setSort('score-asc',event)">Score ↑</button>
  <div class="divider"></div>
  <button class="sort-btn" onclick="setSort('alpha-asc',event)">A → Z</button>
  <button class="sort-btn" onclick="setSort('alpha-desc',event)">Z → A</button>
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input type="text" id="search" placeholder="Search player…" oninput="render()">
  </div>
</div>

<div class="grid" id="grid"></div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwEbbWC6No8mVLb26nVh9JWlw1NspqigjgIiC3UU_LDt62-NYk_0h6jcMSzKmYPHWqAuQ/exec";

let players = [];
let taken   = new Set();
let currentSort = 'score-desc';

function setSyncStatus(state,label){
  document.getElementById('syncDot').className='sync-dot '+state;
  document.getElementById('syncLabel').textContent=label;
}

function showLoading(show,msg){
  document.getElementById('loadingOverlay').classList.toggle('hidden',!show);
  if(msg) document.getElementById('loadingMsg').textContent=msg;
}

async function reloadAll(){
  showLoading(true,'Loading from Google Sheets…');
  setSyncStatus('syncing','Loading…');
  try{
    const res=await fetch(SCRIPT_URL+'?t='+Date.now());
    const data=await res.json();
    if(!data.success) throw new Error(data.error||'Unknown error');
    players=data.players||[];
    taken=new Set(data.taken||[]);
    setSyncStatus('synced','Synced');
  }catch(e){
    setSyncStatus('error','Load failed');
    document.getElementById('grid').innerHTML='<div class="error-state">Could not load player data.</div>';
  }
  showLoading(false);
  render();
}

async function saveToSheets(){
  setSyncStatus('syncing','Saving…');
  try{
    const res=await fetch(SCRIPT_URL,{
      method:'POST',
      body:JSON.stringify({taken:[...taken]})
    });
    const data=await res.json();
    if(!data.success) throw new Error(data.error);
    setSyncStatus('synced','Synced');
  }catch(e){
    setSyncStatus('error','Save failed');
  }
}

function playerKey(p){return `${p.num}-${p.last}-${p.first}`;}

function setSort(s,e){
  currentSort=s;
  document.querySelectorAll('.sort-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  render();
}

function render(){
  if(players.length===0){
    document.getElementById('grid').innerHTML='<div class="empty-state">No Players Loaded</div>';
    return;
  }

  const q=document.getElementById('search').value.toLowerCase();
  let filtered=players.filter(p=>!q||`${p.first} ${p.last} ${p.num}`.toLowerCase().includes(q));

  const available=filtered.filter(p=>!taken.has(playerKey(p)));
  const takenList=filtered.filter(p=>taken.has(playerKey(p)));

  const sorts={
    'score-desc':(a,b)=>((b.total??-1)-(a.total??-1)),
    'score-asc':(a,b)=>((a.total??11)-(b.total??11)),
    'alpha-asc':(a,b)=>a.last.localeCompare(b.last),
    'alpha-desc':(a,b)=>b.last.localeCompare(a.last)
  };
  available.sort(sorts[currentSort]);

  document.getElementById('stat-total').textContent=players.length;
  document.getElementById('stat-available').textContent=players.length-taken.size;
  document.getElementById('stat-taken').textContent=taken.size;

  let html='';
  [...available,...takenList].forEach(p=>{
    const key=playerKey(p);
    const isTaken=taken.has(key);
    html+=`<div style="padding:12px;border:1px solid #30363d;margin:8px;background:${isTaken?'#1a0a0a':'#161b22'}">
      <strong>#${p.num} ${p.first} ${p.last}</strong>
      <div>Total: ${p.total??'—'}</div>
      <button onclick="${isTaken?'undraftPlayer':'draftPlayer'}('${key}')">
        ${isTaken?'Restore':'Mark Taken'}
      </button>
    </div>`;
  });

  document.getElementById('grid').innerHTML=html;
}

async function draftPlayer(key){taken.add(key);render();await saveToSheets();}
async function undraftPlayer(key){taken.delete(key);render();await saveToSheets();}

reloadAll();
</script>

</body>
</html>
