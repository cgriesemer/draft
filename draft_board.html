<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10U Softball Draft Board</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Barlow:wght@400;500&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1c2333;
    --border: #30363d;
    --gold: #f0a500;
    --gold-dim: #a87300;
    --green: #3fb950;
    --red: #f85149;
    --red-bg: #1a0a0a;
    --red-border: #5a1a1a;
    --text: #e6edf3;
    --text-muted: #7d8590;
    --text-dim: #484f58;
    --mono: 'Share Tech Mono', monospace;
    --head: 'Barlow Condensed', sans-serif;
    --body: 'Barlow', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
    min-height: 100vh;
    padding-bottom: 60px;
  }

  /* ── HEADER ── */
  header {
    background: var(--surface);
    border-bottom: 2px solid var(--gold);
    padding: 18px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 24px rgba(0,0,0,0.6);
  }

  .header-left {
    display: flex;
    align-items: baseline;
    gap: 14px;
  }

  h1 {
    font-family: var(--head);
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--gold);
    line-height: 1;
  }

  .subtitle {
    font-family: var(--head);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .header-stats {
    display: flex;
    gap: 24px;
    align-items: center;
  }

  .stat-chip {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .stat-chip span {
    font-size: 20px;
    font-weight: 700;
    font-family: var(--head);
    color: var(--text);
  }

  .stat-chip.taken span { color: var(--red); }

  /* ── CONTROLS ── */
  .controls {
    padding: 14px 28px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .controls-label {
    font-family: var(--head);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-right: 4px;
  }

  .sort-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-family: var(--head);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 7px 16px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .sort-btn:hover {
    border-color: var(--gold-dim);
    color: var(--text);
  }

  .sort-btn.active {
    background: var(--gold);
    border-color: var(--gold);
    color: #000;
  }

  .divider {
    width: 1px;
    height: 24px;
    background: var(--border);
    margin: 0 4px;
  }

  .search-wrap {
    margin-left: auto;
    position: relative;
  }

  .search-wrap input {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--body);
    font-size: 13px;
    padding: 7px 12px 7px 32px;
    border-radius: 4px;
    width: 200px;
    outline: none;
    transition: border-color 0.15s;
  }

  .search-wrap input:focus {
    border-color: var(--gold-dim);
  }

  .search-wrap input::placeholder { color: var(--text-dim); }

  .search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    font-size: 13px;
  }

  /* ── GRID ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 12px;
    padding: 20px 28px;
  }

  /* ── CARD ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
    animation: fadeIn 0.25s ease both;
    position: relative;
  }

  .card:hover {
    border-color: var(--gold-dim);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }

  .card.taken {
    background: var(--red-bg);
    border-color: var(--red-border);
    opacity: 0.75;
  }

  .card.taken:hover {
    border-color: var(--red);
    transform: none;
  }

  .card-header {
    display: flex;
    align-items: stretch;
    border-bottom: 1px solid var(--border);
  }

  .card.taken .card-header {
    border-bottom-color: var(--red-border);
  }

  .jersey {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    background: var(--bg);
    padding: 8px 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 44px;
    letter-spacing: 0.05em;
    border-right: 1px solid var(--border);
    flex-shrink: 0;
  }

  .card.taken .jersey {
    background: #0d0000;
    border-right-color: var(--red-border);
  }

  .name-area {
    flex: 1;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
    min-width: 0;
  }

  .player-name {
    font-family: var(--head);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.02em;
    line-height: 1.1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card.taken .player-name {
    color: var(--red);
    text-decoration: line-through;
    text-decoration-color: rgba(248,81,73,0.5);
  }

  .player-meta {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .taken-badge {
    display: none;
    font-family: var(--head);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--red);
    background: rgba(248,81,73,0.15);
    border: 1px solid rgba(248,81,73,0.3);
    padding: 2px 6px;
    border-radius: 3px;
    width: fit-content;
  }

  .card.taken .taken-badge { display: block; }

  .scores-area {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    border-bottom: 1px solid var(--border);
  }

  .card.taken .scores-area {
    border-bottom-color: var(--red-border);
  }

  .score-cell {
    padding: 10px 8px;
    text-align: center;
    border-right: 1px solid var(--border);
    position: relative;
  }

  .card.taken .score-cell {
    border-right-color: var(--red-border);
  }

  .score-cell:last-child { border-right: none; }

  .score-label {
    font-family: var(--head);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 4px;
  }

  .score-val {
    font-family: var(--mono);
    font-size: 22px;
    line-height: 1;
    color: var(--text);
  }

  .score-val.na {
    font-size: 14px;
    color: var(--text-dim);
  }

  .score-val.total {
    color: var(--gold);
    font-size: 24px;
  }

  .card.taken .score-val.total {
    color: var(--red);
  }

  .score-bar {
    height: 3px;
    background: var(--bg);
    border-radius: 2px;
    margin-top: 5px;
    overflow: hidden;
  }

  .score-bar-fill {
    height: 100%;
    border-radius: 2px;
    background: var(--gold);
    transition: width 0.4s ease;
  }

  .card.taken .score-bar-fill {
    background: var(--red);
  }

  /* tier coloring for total score */
  .score-val.tier-s { color: #58d68d; }
  .score-val.tier-a { color: #f0a500; }
  .score-val.tier-b { color: #85c1e9; }
  .score-val.tier-c { color: var(--text-muted); }
  .card.taken .score-val.tier-s,
  .card.taken .score-val.tier-a,
  .card.taken .score-val.tier-b,
  .card.taken .score-val.tier-c { color: var(--red); }

  .notes-area {
    padding: 10px 12px;
  }

  .notes-text {
    font-family: var(--body);
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    transition: all 0.2s;
  }

  .notes-text.expanded {
    -webkit-line-clamp: unset;
    display: block;
  }

  .notes-toggle {
    background: none;
    border: none;
    color: var(--gold-dim);
    font-family: var(--head);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    margin-top: 5px;
    padding: 0;
    display: none;
  }

  .notes-toggle:hover { color: var(--gold); }
  .card.taken .notes-toggle { color: var(--red-border); }
  .card.taken .notes-toggle:hover { color: var(--red); }

  .card-footer {
    border-top: 1px solid var(--border);
    padding: 8px 12px;
    display: flex;
    justify-content: flex-end;
  }

  .card.taken .card-footer {
    border-top-color: var(--red-border);
  }

  .draft-btn {
    font-family: var(--head);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
    border: 1px solid var(--green);
    background: rgba(63,185,80,0.1);
    color: var(--green);
  }

  .draft-btn:hover {
    background: var(--green);
    color: #000;
  }

  .draft-btn.undo {
    border-color: var(--red-border);
    background: rgba(248,81,73,0.1);
    color: var(--red);
  }

  .draft-btn.undo:hover {
    background: var(--red);
    color: #fff;
  }

  /* ── SECTION DIVIDER ── */
  .taken-section-label {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 0 4px;
    font-family: var(--head);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--red);
    opacity: 0.6;
  }

  .taken-section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--red-border);
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px;
    color: var(--text-dim);
    font-family: var(--head);
    font-size: 18px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    header { padding: 14px 16px; }
    .grid  { padding: 12px 16px; gap: 10px; }
    .controls { padding: 10px 16px; }
    h1 { font-size: 22px; }
    .header-stats { gap: 16px; }
  }
</style>
</head>

  {num:"97", first:"TaKiyah",  last:"Walker-Smith",  bat:5.25, fld:5.25, total:5.25, notes:"Zero bat speed; Did make contact; Never missed ball defensively; Rough; Can get ball in"},
  {num:"101",first:"",         last:"White",         bat:2.0,  fld:null, total:null, notes:"Screams modified; Bad swing and a week late; Took infield with helmet on but stopped the ball; Lacks arm talent"},
  {num:"105",first:"",         last:"Wilson",        bat:7.5,  fld:8.0,  total:7.75, notes:"Good power; Not quite as athletic as McAdams; Good value pick"},
  {num:"107",first:"",         last:"De Leon",       bat:7.25, fld:5.0,  total:6.13, notes:"2005 birthday; Poor form; Has heart; Size and athleticism present; Not great shoulder"},
  {num:"—",  first:"Ireland",  last:"Turner",        bat:3.0,  fld:2.0,  total:2.5,  notes:"Decent swing but very late and lacks pop; Speed 2/10; Scared of ball in outfield; Rough infield work"},
];

// ─── APP LOGIC ───
const BASE_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
let taken = new Set();
let currentSort = 'score-desc';

// 1. SYNC
async function sync() {
  try {
    const res = await fetch(BASE_URL, {
      headers: { 'X-Master-Key': API_KEY }
    });
    if (res.ok) {
      const data = await res.json();
      const remoteTaken = data.record.taken || [];
      if (remoteTaken.length !== taken.size || !remoteTaken.every(id => taken.has(id))) {
        taken = new Set(remoteTaken);
        render();
        console.log("Updated from cloud.");
      }
    }
  } catch (err) { console.error("Sync failed:", err); }
}

// 2. UPDATE
async function pushUpdate() {
  const takenArray = Array.from(taken);
  try {
    await fetch(BASE_URL, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': API_KEY
      },
      body: JSON.stringify({ taken: takenArray })
    });
  } catch (err) { alert("Could not save pick to cloud!"); }
}

// 3. ACTIONS
window.draftPlayer = (key) => {
  taken.add(key);
  render();
  pushUpdate();
};

window.undraftPlayer = (key) => {
  taken.delete(key);
  render();
  pushUpdate();
};

// 4. HELPERS
window.setSort = (s) => {
  currentSort = s;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  render();
}

window.toggleNotes = (safeKey) => {
  const el = document.getElementById(`notes-${safeKey}`);
  const btn = document.getElementById(`toggle-${safeKey}`);
  if (!el || !btn) return;
  const expanded = el.classList.toggle('expanded');
  btn.textContent = expanded ? 'Show less' : 'Show more';
}

function playerKey(p) { return `${p.num}-${p.last}-${p.first}`; }

function scoreColor(val) {
  if (val === null) return '';
  if (val >= 8.0) return 'tier-s';
  if (val >= 7.0) return 'tier-a';
  if (val >= 5.5) return 'tier-b';
  return 'tier-c';
}

function formatScore(val) {
  if (val === null) return '<span class="score-val na">—</span>';
  return `<span class="score-val ${scoreColor(val)}">${val.toFixed(2)}</span>`;
}

function formatTotal(val, isTaken) {
  if (val === null) return '<span class="score-val na total">—</span>';
  const cls = isTaken ? 'total' : `total ${scoreColor(val)}`;
  return `<span class="score-val ${cls}">${val.toFixed(2)}</span>`;
}

function barWidth(val) {
  if (val === null) return 0;
  return Math.min(100, (val / 10) * 100);
}

// 5. RENDER
function render() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  
  let players = RAW.filter(p => {
    if (!q) return true;
    return `${p.first} ${p.last} ${p.num}`.toLowerCase().includes(q);
  });

  const available = players.filter(p => !taken.has(playerKey(p)));
  const takenList = players.filter(p => taken.has(playerKey(p)));

  available.sort((a, b) => {
    if (currentSort === 'score-desc') {
      const sa = a.total ?? -1, sb = b.total ?? -1;
      return sb - sa || a.last.localeCompare(b.last);
    }
    if (currentSort === 'score-asc') {
      const sa = a.total ?? 11, sb = b.total ?? 11;
      return sa - sb || a.last.localeCompare(b.last);
    }
    if (currentSort === 'alpha-asc') return a.last.localeCompare(b.last) || a.first.localeCompare(b.first);
    if (currentSort === 'alpha-desc') return b.last.localeCompare(a.last) || b.first.localeCompare(a.first);
    return 0;
  });

  const allSorted = [...available, ...takenList];

  document.getElementById('stat-total').textContent = RAW.length;
  document.getElementById('stat-available').textContent = RAW.length - taken.size;
  document.getElementById('stat-taken').textContent = taken.size;

  const grid = document.getElementById('grid');

  if (allSorted.length === 0) {
    grid.innerHTML = '<div class="empty-state">No players match your search</div>';
    return;
  }

  let html = '';
  let showedDivider = false;

  allSorted.forEach((p) => {
    const key = playerKey(p);
    const isTaken = taken.has(key);
    const displayName = p.first ? `${p.first} ${p.last}` : p.last;
    const safeKey = key.replace(/[^a-z0-9]/gi,'_');

    if (isTaken && !showedDivider) {
      showedDivider = true;
      html += `<div class="taken-section-label">✕ Taken / Off Board</div>`;
    }

    const batBar = barWidth(p.bat);
    const fldBar = barWidth(p.fld);

    html += `
    <div class="card ${isTaken ? 'taken' : ''}" id="card-${safeKey}">
      <div class="card-header">
        <div class="jersey">#${p.num}</div>
        <div class="name-area">
          <div class="player-name">${displayName}</div>
          <div class="taken-badge">DRAFTED</div>
        </div>
      </div>
      <div class="scores-area">
        <div class="score-cell">
          <div class="score-label">Batting</div>
          ${formatScore(p.bat)}
          <div class="score-bar"><div class="score-bar-fill" style="width:${batBar}%"></div></div>
        </div>
        <div class="score-cell">
          <div class="score-label">Fielding</div>
          ${formatScore(p.fld)}
          <div class="score-bar"><div class="score-bar-fill" style="width:${fldBar}%"></div></div>
        </div>
        <div class="score-cell">
          <div class="score-label">Total</div>
          ${formatTotal(p.total, isTaken)}
        </div>
      </div>
      <div class="notes-area">
        <div class="notes-text" id="notes-${safeKey}">${p.notes}</div>
        <button class="notes-toggle" id="toggle-${safeKey}" onclick="toggleNotes('${safeKey}')">Show more</button>
      </div>
      <div class="card-footer">
        ${isTaken
          ? `<button class="draft-btn undo" onclick="undraftPlayer('${key}')">↩ Restore</button>`
          : `<button class="draft-btn" onclick="draftPlayer('${key}')">✕ Mark Taken</button>`
        }
      </div>
    </div>`;
  });

  grid.innerHTML = html;

  allSorted.forEach(p => {
     const key = playerKey(p);
     const safeKey = key.replace(/[^a-z0-9]/gi,'_');
     const el = document.getElementById(`notes-${safeKey}`);
     const btn = document.getElementById(`toggle-${safeKey}`);
     if (el && btn && el.scrollHeight > el.clientHeight + 2) {
       btn.style.display = 'block';
     }
  });
}

// ─── STARTUP ───
render();
sync();
setInterval(sync, 5000); // Poll every 5 seconds
</script>
</body>
